name: Build social preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-og-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Build baseline JPEG
        run: |
          python - <<'PY'
          from PIL import Image
          src = Image.open('assets/social-preview-alla-litvinenko.jpg').convert('RGB')
          out = src.resize((1200, 630), Image.Resampling.LANCZOS)
          out.save(
              'assets/social-preview-facebook.jpg',
              'JPEG',
              quality=88,
              optimize=True,
              progressive=False,
              subsampling=0
          )
          print(out.size)
          PY

      - name: Commit generated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social-preview-facebook.jpg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build Facebook social preview"
            git push
          fi
